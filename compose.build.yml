# Local build deployment — uses your source tree instead of ghcr.io/usekaneo/kaneo:latest.
# Does not modify compose.yml (official pre-built image).
# Full guide: deploy/docker-build.md
#
#   docker compose -f compose.build.yml up -d --build
#   docker compose -f compose.build.yml up -d --build kaneo   # after code changes

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo:
    build:
      context: .
      dockerfile: Dockerfile.kaneo
    image: kaneo:local
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
